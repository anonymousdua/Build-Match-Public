name: buildmatch
description: BuildMatch – anonymous RFQ / BOQ marketplace for construction contractors and suppliers (Windows desktop).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'   # Flutter 3.29+
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # State + navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Desktop
  window_manager: ^0.4.3
  file_picker: ^8.1.4
  desktop_drop: ^0.5.0
  url_launcher: ^6.3.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
